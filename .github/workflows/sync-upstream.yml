name: Sync upstream

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-sync]

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Fast-forward default branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Fast-forward from aka-danielZhang/deepseek-harness
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPSTREAM_URL: https://github.com/aka-danielZhang/deepseek-harness.git
          # Daniel's repo default is master; do not fetch any other branch.
          UPSTREAM_BRANCH: master
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

          echo "Local ${DEFAULT_BRANCH}:    $(git rev-parse HEAD)"
          echo "Upstream ${UPSTREAM_BRANCH}: $(git rev-parse "upstream/${UPSTREAM_BRANCH}")"

          if git merge --ff-only "upstream/${UPSTREAM_BRANCH}"; then
            git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
            echo "Default branch ${DEFAULT_BRANCH} is $(git rev-parse HEAD)"
            exit 0
          fi

          echo "::error::Default branch '${DEFAULT_BRANCH}' has diverged from aka-danielZhang/deepseek-harness ${UPSTREAM_BRANCH}. Refusing to force-push so local work is not smashed."
          echo "Local-only commits:"
          git log --oneline "upstream/${UPSTREAM_BRANCH}"..HEAD || true
          echo "Upstream-only commits:"
          git log --oneline HEAD.."upstream/${UPSTREAM_BRANCH}" || true
          exit 1
